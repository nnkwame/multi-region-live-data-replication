---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: store-b

resources:
  - ../../../bagisto/app
  - ../../../bagisto/secrets
  - ../ns
  - ingress.yml

patches:
  - target:
      kind: Deployment
      name: bagisto
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_URL
          value: http://kwames-store-b.ironlabs.online
  # Cloud: the base Service is ClusterIP; the nginx ingress controller fronts
  # the app (see ingress.yml in this overlay).