apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: store-b

resources:
  - ../../../bagisto/db
  - ../../../bagisto/secrets
  - ../ns

patches:
  - target:
      kind: Service
      name: mariadb
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30307
