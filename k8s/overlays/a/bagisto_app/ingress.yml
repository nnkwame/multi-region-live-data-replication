---
# Cloud Ingress for store A. Served by the nginx ingress controller
# (k8s/nginx-ingress/deploy.yaml, installed by infra/aws_eks/store_a/up.sh).
# The kwamesdemostore host is also routed here so the demo-URL cutover
# (infra/aws_eks/demo_dns/cutover.sh) can point the Route53 alias at either
# store's NLB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bagisto
  namespace: store-a
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: nginx
  rules:
    - host: kwames-store-a.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bagisto
                port:
                  number: 80
    - host: kwamesdemostore.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bagisto
                port:
                  number: 80