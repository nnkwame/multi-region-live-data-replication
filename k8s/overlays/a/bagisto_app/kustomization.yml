---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: store-a

resources:
  - ../../../bagisto/app
  - ../../../bagisto/secrets
  - ../ns

patches:
  - target:
      kind: Deployment
      name: bagisto
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_URL
          value: http://localhost:8080
  - target:
      kind: Service
      name: bagisto
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080

