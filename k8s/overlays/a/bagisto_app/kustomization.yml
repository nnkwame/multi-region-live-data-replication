---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: store-a

resources:
  - ../../../bagisto/app
  - ../../../bagisto/secrets
  - ../ns
  - ingress.yml

patches:
  - target:
      kind: Deployment
      name: bagisto
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_URL
          value: http://kwames-store-a.ironlabs.online
  # Cloud: the nginx ingress controller fronts the app, so the Service does
  # not need a NodePort (base stays NodePort for the local/minikube clusters).
  - target:
      kind: Service
      name: bagisto
    patch: |-
      - op: add
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort