---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: store-a

resources:
  - ../../../bagisto/db
  - ../../../bagisto/secrets
  - ../ns
  - mariadb-nlb.yml

configMapGenerator:
  - name: mariadb-cdc-config
    files:
      - config/debezium.cnf

patches:
  - target:
      kind: StatefulSet
      name: mariadb
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: mariadb-cdc-config
          mountPath: /etc/mysql/conf.d/debezium.cnf
          subPath: debezium.cnf
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: mariadb-cdc-config
            configMap:
              name: mariadb-cdc-config
