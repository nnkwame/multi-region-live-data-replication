---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app.yml

configMapGenerator:
  - name: bagisto-composer
    files:
      - composer.json=./api/composer.json
      - composer.lock=./api/composer.lock
  - name: bagisto-api-config
    files:
      - bootstrap-app.php=./api/bootstrap-app.php
      - TranslatableModel.php=./api/TranslatableModel.php
      - api-platform.php=./api/api-platform.php
