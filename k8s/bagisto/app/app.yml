---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bagisto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bagisto
  template:
    metadata:
      labels:
        app: bagisto
    spec:
      # Stateless tier: tolerate the spot taint (dedicated=spot:NoSchedule)
      # and prefer spot (workload-type=stateless) nodes. `preferred` not
      # `required`: if spot capacity is gone, pods fall back to the on-demand
      # group instead of hanging. Stateful workloads (mariadb, kafka, connect,
      # monitoring) deliberately have NO toleration and stay on on-demand.
      tolerations:
        - key: dedicated
          operator: Equal
          value: spot
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 10
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - stateless
      initContainers:
        - name: initialize-media
          image: webkul/bagisto:2.4.13-nginx-mariadb
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -z "$(ls -A /media)" ]; then
                cp -a /var/www/bagisto/storage/app/public/. /media/
              fi
              chown -R www-data:www-data /media
          volumeMounts:
            - name: media
              mountPath: /media
        - name: composer-install
          image: webkul/bagisto:2.4.13-nginx-mariadb


          workingDir: /var/www/bagisto

          command:
           - sh
           - -c
           - |
             composer install \
               --no-interaction \
               --no-dev \
               --prefer-dist \
               --optimize-autoloader

          volumeMounts:
            - name: composer-files
              mountPath: /var/www/bagisto/composer.json
              subPath: composer.json

            - name: composer-files
              mountPath: /var/www/bagisto/composer.lock
              subPath: composer.lock

            - name: vendor
              mountPath: /var/www/bagisto/vendor

      containers:
        - name: bagisto
          image: webkul/bagisto:2.4.13-nginx-mariadb
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -e
              cd /var/www/bagisto
              php artisan package:discover --no-ansi
              exec /usr/local/bin/entrypoint.sh /bin/bash -c '
                set -e
                cd /var/www/bagisto
                php artisan vendor:publish --tag=bagistoapi-views --tag=bagistoapi-assets --tag=bagistoapi-graphiql-assets --no-interaction --no-ansi
                mkdir -p public/vendor storage/framework/cache/data storage/logs
                if [ ! -e public/vendor/api-platform ]; then
                  ln -s /var/www/bagisto/vendor/api-platform/laravel/public public/vendor/api-platform
                fi
                chown -R www-data:www-data storage/framework storage/logs bootstrap/cache
                exec /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
              '
          
          env:
            - name: DB_CONNECTION
              value: "mariadb"
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: "3306" 
            #- name: APP_URL
            #  value: https://your-domain.com
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: appkey
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: dbusername
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: dbpassword

          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
          volumeMounts:
            - name: api-config
              mountPath: /var/www/bagisto/bootstrap/app.php
              subPath: bootstrap-app.php
            - name: api-config
              mountPath: /var/www/bagisto/packages/Webkul/Core/src/Eloquent/TranslatableModel.php
              subPath: TranslatableModel.php
            - name: api-config
              mountPath: /var/www/bagisto/config/api-platform.php
              subPath: api-platform.php
            - name: media
              mountPath: /var/www/bagisto/storage/app/public
            - name: composer-files
              mountPath: /var/www/bagisto/composer.json
              subPath: composer.json

            - name: composer-files
              mountPath: /var/www/bagisto/composer.lock
              subPath: composer.lock

            - name: vendor
              mountPath: /var/www/bagisto/vendor

      volumes:
        - name: api-config
          configMap:
            name: bagisto-api-config
        - name: media
          persistentVolumeClaim:
            claimName: bagisto-media
        - name: composer-files
          configMap:
            name: bagisto-composer
            defaultMode: 0755
        - name: vendor
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bagisto-media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bagisto
spec:
  type: NodePort
  selector:
    app: bagisto
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

