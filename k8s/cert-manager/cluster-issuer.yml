---
# cert-manager ClusterIssuers: Let's Encrypt via DNS-01 (Route53).
#
# cert-manager authenticates to Route53 through the IRSA role Terraform
# creates for the `cert-manager` ServiceAccount (see infra/aws_eks/*/irsa.tf)
# — no AWS credentials are stored in the cluster. The RoleArn is projected
# automatically from the SA annotation; this manifest only needs the region
# of the Route53 API (global, us-east-1 serves all clusters here).
#
# Two issuers, per the class convention:
#   letsencrypt-staging — unlimited-ish issuance for solver validation;
#                         certs are NOT browser-trusted.
#   letsencrypt-prod    — browser-trusted, rate-limited (5 duplicate
#                         certs/domain/week). Point Ingresses here once the
#                         solver works; flip back if issuance fails.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: kidfisch@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - selector: {}
        dns01:
          route53:
            region: us-east-1
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: kidfisch@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - selector: {}
        dns01:
          route53:
            region: us-east-1