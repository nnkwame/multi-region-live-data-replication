---
# Cloud monitoring for the data-replication cluster: stock Grafana + its
# ingress. The local variant lives in ./local (standalone Prometheus,
# provisioned dashboards). The Prometheus Operator-based prometheus.yml in
# this directory is kept as WIP and intentionally not listed here.
#
# Grafana admin credentials come from the gitignored
# .env.grafana-data-replication file (key=value lines); create it before
# building this overlay:
#   GF_SECURITY_ADMIN_USER=admin
#   GF_SECURITY_ADMIN_PASSWORD=<random>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-replication

resources:
  - namespace.yml
  - grafana.yml
  - ingress.yml

secretGenerator:
  - name: grafana-admin
    envs:
      - .env.grafana-data-replication

patches:
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: GF_SECURITY_ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: GF_SECURITY_ADMIN_USER
          - name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: GF_SECURITY_ADMIN_PASSWORD
          # The ingress terminates TLS; Grafana itself serves plain HTTP.
          - name: GF_SERVER_ROOT_URL
            value: https://kwames-data-replication.ironlabs.online
