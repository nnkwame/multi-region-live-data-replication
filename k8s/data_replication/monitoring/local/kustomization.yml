apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data-replication
resources:
  - stack.yml
configMapGenerator:
  - name: capstone-prometheus-config
    files:
      - prometheus.yml
      - alerts.yml
  - name: capstone-grafana-provisioning
    files:
      - datasource.yml
      - dashboards.yml
  - name: capstone-strimzi-dashboards
    files:
      - dashboards/strimzi-kafka.json
      - dashboards/strimzi-kafka-connect.json
