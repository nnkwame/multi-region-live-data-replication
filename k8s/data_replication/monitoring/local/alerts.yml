groups:
  - name: capstone-connect
    rules:
      - alert: KafkaConnectorNotRunning
        expr: kafka_connect_connector_status{status=~"failed|paused|unassigned"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A Kafka connector is not running
      - alert: StrimziMetricsTargetDown
        expr: up{job="strimzi-pods"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Strimzi metrics target is unavailable
      - alert: KafkaConnectRecordsSkipped
        expr: kafka_connect_task_error_total_records_skipped > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Kafka Connect skipped records
      - alert: KafkaConnectDeadLetterWriteFailed
        expr: kafka_connect_task_error_deadletterqueue_produce_failures > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Kafka Connect could not write to its dead-letter queue
