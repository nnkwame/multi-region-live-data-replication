# To use the KafkaConnector resource, you have to first enable the connector operator using
# the strimzi.io/use-connector-resources annotation on the KafkaConnect custom resource.
# From Apache Kafka 3.1.1 and 3.2.0, you also have to add the FileStreamSourceConnector
# connector to the container image. You can do that using the kafka-connect-build.yaml example.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: my-sink-connector
  labels:
    # The strimzi.io/cluster label identifies the KafkaConnect instance
    # in which to create this connector. That KafkaConnect instance
    # must have the strimzi.io/use-connector-resources annotation
    # set to true.
    strimzi.io/cluster: my-connect-cluster
spec:
  class: io.debezium.connector.jdbc.JdbcSinkConnector
  tasksMax: 1 #2
  config:
    # First catch up orders alone, then expand to the captured child tables.
    topics.regex: "store-a\\.bagisto\\..*"
    collection.name.format: "${source.table}"
    connection.url: "jdbc:mariadb://mariadb.store-b.svc.cluster.local:3306/bagisto" # "jdbc:mariadb://192.168.1.50:3306/bagisto" # "jdbc:mariadb://db.example.com:3306/bagisto" # "jdbc:mariadb://mydb.abcdef.eu-central-1.rds.amazonaws.com:3306/bagisto"
    connection.username: "${env:STORE_B_DB_USER}"
    connection.password: "${env:STORE_B_DB_PASSWORD}"
    insert.mode: "upsert"
    delete.enabled: "true"
    primary.key.mode: "record_key"
    schema.evolution: "basic" # "validate-only"
    errors.tolerance: "all"
    errors.deadletterqueue.topic.name: "dlq-my-topic"
    errors.deadletterqueue.topic.replication.factor: 1
    errors.deadletterqueue.context.headers.enable: "true"
    #use.time.zone: "UTC"
