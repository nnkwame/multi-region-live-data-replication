apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: my-connect-cluster
  annotations:
#  use-connector-resources configures this KafkaConnect
#  # to use KafkaConnector resources to avoid
#  # needing to call the Connect REST API directly
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.3.1
  replicas: 1
  bootstrapServers: my-cluster-kafka-bootstrap:9093
  groupId: my-connect-group
  configStorageTopic: my-connect-configs
  statusStorageTopic: my-connect-status
  offsetStorageTopic: my-connect-offsets
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: connect-metrics
        key: metrics-config.yml
  build:
    output:
      type: docker
      # Cloud deployment must replace this placeholder and configure registry credentials.
      # The Minikube overlay removes this build block and uses the locally loaded image.
      image: example.invalid/capstone-connect:3.7.1-kafka-4.3.1
    plugins:
      - name: debezium-mariadb
        artifacts:
          - type: tgz
            url: https://repo.maven.apache.org/maven2/io/debezium/debezium-connector-mariadb/3.7.1.Final/debezium-connector-mariadb-3.7.1.Final-plugin.tar.gz
            sha512sum: eb01700b43216ad3edcc0401b88747d92fdfbe310f32ccbdc85a372c184e40390f00d7ed146235190527c9629de901f7da7613d180a5f8fb35d98b99eb23b2ce
      - name: debezium-jdbc
        artifacts:
          - type: tgz
            url: https://repo.maven.apache.org/maven2/io/debezium/debezium-connector-jdbc/3.7.1.Final/debezium-connector-jdbc-3.7.1.Final-plugin.tar.gz
            sha512sum: c8520f33a2176a55db677a164c3b77353242a422937f7056e0d53a85a9f078328a9a2ce62c6f803c447ae2b978df2a2d0af02792b0e27f7f751222c1e62e63fb
  tls:
    trustedCertificates:
      - secretName: my-cluster-cluster-ca-cert
        pattern: "*.crt"
  config:
    # -1 means it will use the default replication factor configured in the broker
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1

    config.providers: env
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider

  template:
    connectContainer:
      env:
        - name: STORE_A_DB_USER
          valueFrom:
            secretKeyRef:
              name: store-a-db-credentials
              key: dbusername

        - name: STORE_A_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: store-a-db-credentials
              key: dbpassword

        - name: STORE_B_DB_USER
          valueFrom:
            secretKeyRef:
              name: store-b-db-credentials
              key: dbusername

        - name: STORE_B_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: store-b-db-credentials
              key: dbpassword
